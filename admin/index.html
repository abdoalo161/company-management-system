        <div class="recent-activity card mt-4">
            <div class="card-header">
                <h2>Recent Activity</h2>
            </div>
            <div class="card-body">
                <div class="activity-list" id="activityList">
                    <!-- Activity items will be dynamically added here -->
                    <div class="activity-item">
                        <p>No recent activity</p>
                    </div>
                </div>
                
                <script>
                    // Add some test activity items
                    setTimeout(function() {
                        const activityList = document.getElementById('activityList');
                        if (activityList) {
                            // Clear the 'no activity' message
                            activityList.innerHTML = '';
                            
                            // Add some test activities
                            const activities = [
                                { title: 'Project Created', message: 'New website redesign project added', time: 'Just now' },
                                { title: 'User Updated', message: 'John Doe\'s profile has been updated', time: '5 minutes ago' },
                                { title: 'Team Added', message: 'New QA team has been created', time: '1 hour ago' },
                                { title: 'Project Completed', message: 'Mobile app project marked as completed', time: 'Yesterday' }
                            ];
                            
                            // Add each activity to the list
                            activities.forEach(function(activity) {
                                const activityItem = document.createElement('div');
                                activityItem.className = 'activity-item';
                                activityItem.innerHTML = `
                                    <p><strong>${activity.title}</strong> - ${activity.message}</p>
                                    <span class="time text-muted">${activity.time}</span>
                                `;
                                activityList.appendChild(activityItem);
                            });
                        }
                    }, 500);
                </script>
            </div>
        </div>
